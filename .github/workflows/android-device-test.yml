name: Test Android widget on emulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-project.zip"
      - ".github/workflows/android-device-test.yml"

jobs:
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Android project
        run: unzip -q android-project.zip -d android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run widget sync on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          script: |
            gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell appwidget grantbind --package com.ddollo.lightdesk --user 0
            gradle -p android :app:connectedDebugAndroidTest
