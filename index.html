<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#315c46">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lightdesk">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./favicon.svg">
  <title>Lightdesk</title>
  <style>
    :root{--bg:#fafbf8;--paper:#fff;--text:#17221b;--muted:#7a817c;--line:#e2e6df;--green:#315c46;--soft:#dfeae3;--danger:#a54c45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Malgun Gothic",sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.center{min-height:100vh;display:grid;place-items:center;padding:20px}.auth{width:min(390px,100%);padding:28px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 18px 50px #1e26210d}.mark{width:20px;height:20px;border-radius:6px;background:var(--green);margin-bottom:18px}.auth h1{margin:0;font-size:29px}.auth>p{margin:8px 0 22px;color:var(--muted);font-size:13px}.auth label{display:block;margin:0 0 13px;color:var(--muted);font-size:12px}.auth input{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:9px;outline:none}.auth input:focus{border-color:var(--green);box-shadow:0 0 0 2px var(--soft)}.auth .submit{width:100%;padding:11px;border:0;border-radius:9px;background:var(--green);color:#fff}.switch{display:block;margin:15px auto 0;border:0;background:transparent;color:var(--green);font-size:12px}.msg{margin-top:13px;color:var(--danger);font-size:12px}.app{max-width:1440px;margin:auto;padding:25px 30px 40px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.date{margin:0 0 4px;color:var(--muted);font-size:12px}.top h1{margin:0;font-size:30px}.top h1 span{margin-left:8px;color:var(--green);font-size:14px;font-weight:500}.actions{display:flex;align-items:center;gap:8px}.actions span{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:11px}.actions button,.addcat{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted)}.addcat{border-color:var(--green)!important;background:var(--green)!important;color:#fff!important}.notice{margin-bottom:12px;padding:9px 12px;border-radius:8px;background:#f6e9e7;color:var(--danger);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,360px));gap:13px;align-items:start}.card{min-height:330px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.head h2{margin:0;font-size:20px}.menu{position:relative}.dots{width:31px;height:28px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted)}.pop{position:absolute;right:0;top:32px;z-index:4;width:120px;padding:4px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 10px 25px #1112}.pop button{display:block;width:100%;padding:8px;border:0;background:transparent;text-align:left;font-size:12px}.pop .danger{color:var(--danger)}.addtask{width:100%;padding:9px;border:1px dashed #ccd5ce;border-radius:8px;background:#fbfcfa;color:var(--green);text-align:left}.editor{margin-bottom:8px}.editor form{display:grid;grid-template-columns:1fr 38px;gap:5px}.editor input{min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px}.editor form button{border:0;border-radius:8px;background:var(--green);color:#fff;font-size:18px}.prio{display:flex;align-items:center;gap:3px;margin-top:6px;color:var(--muted);font-size:11px}.prio button{width:26px;height:25px;padding:0;border:0;border-radius:6px;background:transparent}.prio button.sel{background:var(--soft);color:var(--green)}.prio .cancel{width:auto;margin-left:auto}.empty{padding:18px 3px;color:#9a9e9b;font-size:12px}.task{display:grid;grid-template-columns:24px 1fr 28px 26px;align-items:center;min-height:45px;border-bottom:1px solid var(--line)}.check{width:17px;height:17px;padding:0;border:1px solid #86948b;border-radius:50%;background:#fff}.task.done .check{border-color:var(--green);background:var(--green)}.task.done .check:after{content:"✓";display:block;color:#fff;font-size:11px;line-height:15px}.task.p1 span{font-size:16px;font-weight:750}.task.p2 span{font-size:14px;font-weight:600}.task.p3 span{font-size:13px;font-weight:400}.task.done span{text-decoration:line-through;color:#a1a6a2}.pin,.del{border:0;background:transparent;color:#a1a6a2}.pin{width:27px;height:30px;padding:0;font-size:17px}.pin.on{color:var(--green);font-weight:800}.del{color:#9a9e9b}.completed{margin-top:18px;padding-top:10px;border-top:1px dashed var(--line)}.completed>p{margin:0 0 3px;color:var(--muted);font-size:11px;font-weight:600}@media(max-width:650px){.app{padding:18px 14px 30px}.top{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.actions span{display:none}.grid{grid-template-columns:1fr}.card{min-height:250px}.top h1{font-size:27px}}
  </style>
</head>
<body>
  <main id="auth" class="center"><section class="auth"><div class="mark"></div><h1>Lightdesk</h1><p id="authMsg">업무 목록을 불러오는 중…</p></section></main>
  <main id="app" class="app hidden"><header class="top"><div><p id="date" class="date"></p><h1>오늘 <span id="count">0 / 0</span></h1></div><div class="actions"><span>자동 연동</span><button id="addCategory" class="addcat" type="button">＋ 카테고리</button></div></header><div id="notice" class="notice hidden"></div><section id="grid" class="grid"></section></main>
  <script>
    const BASE='https://rrhvcotzvyzypusapkpy.supabase.co';
    const KEY='sb_publishable_JyzZo3tYGxuiy7hO9-rS7w_wS4y2pte';
    const $=s=>document.querySelector(s); let categories=[], tasks=[], editor=null, menus=null, priorities={}, loading=false, started=false;const legacyWidgetIds=new Set(JSON.parse(localStorage.getItem('lightdesk_widget_ids')||'[]').map(String));
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function request(path,opt={}){const h={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json',...(opt.headers||{})};const r=await fetch(BASE+path,{...opt,headers:h});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.msg||e.message||e.error_description||'요청을 처리하지 못했습니다.')}return r.status===204?null:r.json()}
    async function load(){if(loading)return;loading=true;try{const [c,t]=await Promise.all([request('/rest/v1/lightdesk_categories?select=*&order=position.asc,created_at.asc'),request('/rest/v1/lightdesk_tasks?select=*&order=position.asc,created_at.asc')]);const before=JSON.stringify([categories,tasks]);categories=c;tasks=t;if(!categories.length){categories=await request('/rest/v1/lightdesk_categories',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify([{name:'조명',position:0},{name:'가방',position:1}])})}await migrateWidgetSelection();if(before!==JSON.stringify([categories,tasks]))render()}finally{loading=false}}
    async function migrateWidgetSelection(){if(localStorage.getItem('lightdesk_widget_migrated'))return;const ids=tasks.filter(t=>legacyWidgetIds.has(String(t.id))).map(t=>t.id);if(ids.length){await request('/rest/v1/lightdesk_tasks?id=in.('+ids.join(',')+')',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({show_in_widget:true})});tasks.forEach(t=>{if(ids.includes(t.id))t.show_in_widget=true})}localStorage.setItem('lightdesk_widget_migrated','1')}
    function showNotice(m){$('#notice').textContent=m;$('#notice').classList.toggle('hidden',!m)}
    function render(){const done=tasks.filter(t=>t.completed).length;$('#count').textContent=`${done} / ${tasks.length}`;$('#grid').innerHTML=categories.map(card).join('');bind();syncWidget()}
    function card(c){const list=tasks.filter(t=>t.category_id===c.id),active=list.filter(t=>!t.completed),done=list.filter(t=>t.completed),open=editor===c.id;return `<article class="card"><div class="head"><h2>${esc(c.name)}</h2><div class="menu"><button class="dots" data-menu="${c.id}">⋯</button>${menus===c.id?`<div class="pop"><button data-rename="${c.id}">이름 변경</button><button class="danger" data-delcat="${c.id}">카테고리 삭제</button></div>`:''}</div></div>${open?`<div class="editor"><form data-add="${c.id}"><input placeholder="할 일 추가…" required><button>＋</button></form><div class="prio"><span>글씨</span>${[1,2,3].map(p=>`<button data-prio="${c.id}:${p}" class="${(priorities[c.id]||2)===p?'sel':''}">${p}</button>`).join('')}<button class="cancel" data-cancel="1">취소</button></div></div>`:`<button class="addtask" data-editor="${c.id}">＋ 할 일</button>`}<div>${active.length?active.map(row).join(''):'<div class="empty">아직 할 일이 없어요</div>'}</div>${done.length?`<div class="completed"><p>완료됨 ${done.length}</p>${done.map(row).join('')}</div>`:''}</article>`}
    function row(t){const pinned=!!t.show_in_widget;return `<div class="task p${t.priority}${t.completed?' done':''}"><button class="check" data-toggle="${t.id}" aria-label="완료"></button><span>${esc(t.title)}</span><button class="pin${pinned?' on':''}" data-widget="${t.id}" aria-label="위젯에 표시" title="위젯에 표시">${pinned?'▣':'□'}</button><button class="del" data-deltask="${t.id}">×</button></div>`}
    function bind(){document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{menus=menus===b.dataset.menu?null:b.dataset.menu;render()});document.querySelectorAll('[data-editor]').forEach(b=>b.onclick=()=>{editor=b.dataset.editor;render()});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{editor=null;render()});document.querySelectorAll('[data-prio]').forEach(b=>b.onclick=()=>{const[id,p]=b.dataset.prio.split(':');priorities[id]=+p;render()});document.querySelectorAll('[data-add]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const id=f.dataset.add,title=f.querySelector('input').value.trim();if(!title)return;try{const x=await request('/rest/v1/lightdesk_tasks',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:session.user.id,category_id:id,title,priority:priorities[id]||2,completed:false,position:tasks.filter(t=>t.category_id===id).length})});tasks.push(x[0]);editor=null;render()}catch(e){showNotice(e.message)}});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle));document.querySelectorAll('[data-widget]').forEach(b=>b.onclick=()=>toggleWidget(b.dataset.widget));document.querySelectorAll('[data-deltask]').forEach(b=>b.onclick=()=>delTask(b.dataset.deltask));document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>renameCat(b.dataset.rename));document.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=()=>delCat(b.dataset.delcat))}
    async function toggleWidget(id){const t=tasks.find(x=>x.id===id);if(!t)return;try{await request('/rest/v1/lightdesk_tasks?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({show_in_widget:!t.show_in_widget})});t.show_in_widget=!t.show_in_widget;render()}catch(e){showNotice(e.message)}}
    function syncWidget(){if(!window.AndroidWidget)return;const picked=tasks.filter(t=>t.show_in_widget).map(t=>({id:String(t.id),title:t.title,priority:t.priority,completed:t.completed,category:categories.find(c=>c.id===t.category_id)?.name||''}));AndroidWidget.syncTasks(JSON.stringify(picked))}
    async function toggle(id){const t=tasks.find(x=>x.id===id);try{await request('/rest/v1/lightdesk_tasks?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({completed:!t.completed})});t.completed=!t.completed;render()}catch(e){showNotice(e.message)}}
    async function delTask(id){if(!confirm('이 할 일을 삭제할까요?'))return;try{await request('/rest/v1/lightdesk_tasks?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}});tasks=tasks.filter(t=>t.id!==id);render()}catch(e){showNotice(e.message)}}
    async function renameCat(id){const c=categories.find(x=>x.id===id),name=prompt('카테고리 이름',c.name)?.trim();if(!name)return;try{await request('/rest/v1/lightdesk_categories?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({name})});c.name=name;menus=null;render()}catch(e){showNotice(e.message)}}
    async function delCat(id){const c=categories.find(x=>x.id===id);if(!confirm(`'${c.name}' 카테고리와 안의 할 일을 모두 삭제할까요?`))return;try{await request('/rest/v1/lightdesk_categories?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}});categories=categories.filter(x=>x.id!==id);tasks=tasks.filter(x=>x.category_id!==id);render()}catch(e){showNotice(e.message)}}
    $('#addCategory').onclick=async()=>{const name=prompt('새 카테고리 이름')?.trim();if(!name)return;try{const x=await request('/rest/v1/lightdesk_categories',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({name,position:categories.length})});categories.push(x[0]);render()}catch(e){showNotice(e.message)}};
    async function start(){if(started)return;try{await load();started=true;$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');setInterval(()=>load().catch(()=>{}),2000);addEventListener('focus',()=>load().catch(()=>{}));document.addEventListener('visibilitychange',()=>{if(!document.hidden)load().catch(()=>{})})}catch(e){$('#authMsg').textContent='연결 중… 잠시 후 다시 시도합니다.';setTimeout(start,3000)}}
    $('#date').textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'}).format(new Date());start();
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  </script>
</body>
</html>
